<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="How Oleo talks to your agents" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>How Oleo talks to your agents</title>
  <defs>
    <marker id="go" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#8a98a8"/></marker>
    <marker id="back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#12a46a"/></marker>
  </defs>
  <text x="600" y="44" font-size="22" font-weight="600" fill="#1d2530" text-anchor="middle">How Oleo talks to your agents</text>
  
    <rect x="60" y="84" width="260" height="132" rx="22" fill="#ffffff" stroke="#cfd7e0" stroke-width="2"/>
    
    <text x="88" y="140" font-size="30" font-weight="700" fill="#1d2530">Your agent</text>
    <text x="88" y="172" font-size="17" fill="#5b6a7b">Claude Code, Codex, Cursor</text>
  
    <rect x="470" y="84" width="260" height="132" rx="22" fill="#ffffff" stroke="#cfd7e0" stroke-width="2"/>
    
    <text x="498" y="140" font-size="30" font-weight="700" fill="#1d2530">oleo-hook</text>
    <text x="498" y="172" font-size="17" fill="#5b6a7b">a tiny relay</text>
  
    <rect x="880" y="84" width="260" height="132" rx="22" fill="#ffffff" stroke="#cfd7e0" stroke-width="2"/>
    <image href="data:image/png;base64," x="904" y="118" width="64" height="64"/>
    <text x="986" y="142" font-size="30" font-weight="700" fill="#1d2530">Oleo</text>
    <text x="986" y="172" font-size="17" fill="#5b6a7b">the island</text>
  <line x1="332" y1="128" x2="460" y2="128" stroke="#8a98a8" stroke-width="3" marker-end="url(#go)"/>
  <text x="396" y="112" font-size="16" fill="#5b6a7b" text-anchor="middle">hook event</text>
  <line x1="742" y1="128" x2="870" y2="128" stroke="#8a98a8" stroke-width="3" marker-end="url(#go)"/>
  <text x="806" y="112" font-size="16" fill="#5b6a7b" text-anchor="middle">local pipe</text>
  <line x1="870" y1="176" x2="742" y2="176" stroke="#12a46a" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#back)"/>
  <text x="806" y="204" font-size="16" fill="#12a46a" text-anchor="middle" font-weight="600">your click</text>
  <line x1="460" y1="176" x2="332" y2="176" stroke="#12a46a" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#back)"/>
  <text x="396" y="204" font-size="16" fill="#12a46a" text-anchor="middle" font-weight="600">the answer</text>
  <text x="190" y="256" font-size="17" fill="#5b6a7b" text-anchor="middle">Starts the relay on every event.</text><text x="600" y="256" font-size="17" fill="#5b6a7b" text-anchor="middle">Waits 300 ms for Oleo, then steps aside.</text><text x="1010" y="256" font-size="17" fill="#5b6a7b" text-anchor="middle">Decides only when you click.</text>
</svg>
